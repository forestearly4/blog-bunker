[build]
  base      = "/"
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"
  ignore    = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src/ netlify/ netlify.toml package.json vite.config.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.social-scheduler]
  schedule = "0 * * * *"

# Claude AI proxy
[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude-proxy"
  status = 200

# Wix proxy — Edge Function (no cold start, works on free tier)
[[edge_functions]]
  path     = "/api/wix"
  function = "wix-proxy"

# Wix OAuth token exchange
[[redirects]]
  from   = "/api/wix-token"
  to     = "/.netlify/functions/wix-token"
  status = 200

[[redirects]]
  from   = "/api/wix-callback"
  to     = "/.netlify/functions/wix-oauth-callback"
  status = 200

[[redirects]]
  from   = "/api/meta-callback"
  to     = "/.netlify/functions/meta-oauth-callback"
  status = 200

[[redirects]]
  from   = "/api/meta-post"
  to     = "/.netlify/functions/meta-post"
  status = 200

[[redirects]]
  from   = "/api/data"
  to     = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from   = "/api/media"
  to     = "/.netlify/functions/media"
  status = 200

[[redirects]]
  from   = "/api/gsc-callback"
  to     = "/.netlify/functions/gsc-oauth-callback"
  status = 200

[[redirects]]
  from   = "/api/gsc-refresh"
  to     = "/.netlify/functions/gsc-refresh"
  status = 200

[[redirects]]
  from   = "/api/gcs"
  to     = "/.netlify/functions/gcs"
  status = 200

[[redirects]]
  from   = "/api/google-callback"
  to     = "/.netlify/functions/google-auth-callback"
  status = 200

[[redirects]]
  from   = "/api/google-refresh"
  to     = "/.netlify/functions/google-refresh"
  status = 200

[[redirects]]
  from   = "/api/image-generate"
  to     = "/.netlify/functions/image-generate"
  status = 200

[[redirects]]
  from   = "/api/gcs-upload"
  to     = "/.netlify/functions/gcs-upload"
  status = 200

[[redirects]]
  from   = "/api/gcs-signed-url"
  to     = "/.netlify/functions/gcs-signed-url"
  status = 200

[[redirects]]
  from   = "/api/gcs-finalize"
  to     = "/.netlify/functions/gcs-finalize"
  status = 200

[[redirects]]
  from   = "/api/scan-competitor"
  to     = "/.netlify/functions/scan-competitor"
  status = 200

[[redirects]]
  from   = "/api/buffer-post"
  to     = "/.netlify/functions/buffer-post"
  status = 200

[[redirects]]
  from   = "/api/upload-image"
  to     = "/.netlify/functions/upload-image"
  status = 200

[[redirects]]
  from   = "/api/get-image"
  to     = "/.netlify/functions/get-image"
  status = 200

# SPA fallback — MUST be last so it doesn't swallow API routes above
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
