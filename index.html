<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blog Bunker" />
    <meta name="theme-color" content="#d4a054" />
    <meta name="description" content="AI-powered blogging and marketing platform for lifestyle bloggers" />
    <title>Blog Bunker</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      #root { min-height: 100%; }
      body {
        background: #0e0f11;
        color: #e8e6e1;
        font-family: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* Covers the blank moment between a hard reload (workspace switch,
         first load, manual refresh) and React actually painting content —
         plain inline CSS/JS only, since it has to work before any bundle
         has loaded. #bb-splash sits OUTSIDE #root so React never touches
         it; the script at the bottom removes it once #root has content. */
      #bb-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 32px; text-align: center;
        background: #0e0f11;
        transition: opacity 0.4s ease;
      }
      #bb-splash .bb-splash-mark { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #d4a054; }
      #bb-splash .bb-splash-quote { max-width: 480px; font-family: Georgia, serif; font-size: 19px; line-height: 1.5; color: #e8e6e1; }
      #bb-splash .bb-splash-attr { font-size: 12px; color: #888; }
    </style>
  </head>
  <body>
    <div id="bb-splash">
      <div class="bb-splash-mark">Blog Bunker</div>
      <div class="bb-splash-quote" id="bb-splash-quote">Cast at dawn. Sip at dusk.</div>
      <div class="bb-splash-attr" id="bb-splash-attr"></div>
    </div>
    <div id="root"></div>
    <script>
      // A short rotation of quotes in the Cask & Stream voice (fishing,
      // whiskey, and the patient/creative work of building something) —
      // picked fresh on every load, so switching workspaces (which does a
      // full reload to re-hydrate every workspace-scoped store) shows a
      // different one each time instead of the same static screen.
      (function () {
        var quotes = [
          ["Cast at dawn. Sip at dusk.", ""],
          ["The river doesn't rush, and neither should a good pour.", ""],
          ["Patience is a fly line laid out just right.", ""],
          ["Good things happen on their own schedule — the fish, the barrel, the draft.", ""],
          ["Some days you fish. Some days you build the boat.", ""],
          ["A slow morning on the water beats a fast one anywhere else.", ""],
          ["Every great pour started as someone's patient experiment.", ""],
          ["The best ideas surface when you stop forcing the cast.", ""],
          ["Small, steady work — like aging in the barrel — is still work.", ""],
          ["Read the water first. Everything else follows.", ""],
        ];
        var pick = quotes[Math.floor(Math.random() * quotes.length)];
        var q = document.getElementById("bb-splash-quote");
        var a = document.getElementById("bb-splash-attr");
        if (q) q.textContent = pick[0];
        if (a) a.textContent = pick[1] || "";

        // Fade the splash out once React has actually painted something
        // into #root, then remove it from the DOM. Falls back to a fixed
        // timeout so a slow/failed boot never leaves it stuck forever.
        var root = document.getElementById("root");
        var splash = document.getElementById("bb-splash");
        var removed = false;
        function removeSplash() {
          if (removed || !splash) return;
          removed = true;
          splash.style.opacity = "0";
          setTimeout(function () { splash.remove(); }, 400);
        }
        if (root && splash) {
          var obs = new MutationObserver(function () {
            if (root.childNodes.length > 0) { obs.disconnect(); removeSplash(); }
          });
          obs.observe(root, { childList: true });
        }
        setTimeout(removeSplash, 6000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
