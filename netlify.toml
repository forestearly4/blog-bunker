[build]
  command   = "npm run build"
  publish   = "dist"
[build.environment]
  NODE_VERSION = "20"
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude-proxy"
  status = 200

# Proxy Wix Blog API calls server-side (CORS + key safety)
[[redirects]]
  from   = "/api/wix"
  to     = "/.netlify/functions/wix-proxy"
  status = 200
